<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="tw-sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.38" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#f9a8d4"/>
      <stop offset="0.62" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="tw-grass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.45" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#166534"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="tw-mud" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#4a2a10"/>
      <stop offset="0.7" stop-color="#7c4a21"/>
      <stop offset="1" stop-color="#a16207"/>
    </radialGradient>
    <pattern id="tw-braid" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="12" height="12" fill="#d6a55c"/>
      <rect width="5" height="12" fill="#8a5a2b" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- sky: day on Team Sun's side, night on Team Moon's -->
  <rect width="600" height="400" fill="url(#tw-sky)"/>
  <g fill="#fde047">
    <rect x="76" y="20" width="8" height="18" rx="4"/>
    <rect x="76" y="122" width="8" height="18" rx="4"/>
    <rect x="22" y="76" width="18" height="8" rx="4"/>
    <rect x="120" y="76" width="18" height="8" rx="4"/>
    <rect x="36" y="34" width="8" height="18" rx="4" transform="rotate(-45 40 43)"/>
    <rect x="116" y="108" width="8" height="18" rx="4" transform="rotate(-45 120 117)"/>
    <rect x="116" y="34" width="8" height="18" rx="4" transform="rotate(45 120 43)"/>
    <rect x="36" y="108" width="8" height="18" rx="4" transform="rotate(45 40 117)"/>
  </g>
  <circle cx="80" cy="80" r="38" fill="#facc15" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="68" cy="74" r="4" fill="#92400e"/>
  <circle cx="92" cy="74" r="4" fill="#92400e"/>
  <path d="M66 90 Q80 102 94 90" stroke="#92400e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="190" cy="60" rx="34" ry="14"/>
    <ellipse cx="168" cy="66" rx="22" ry="11"/>
    <ellipse cx="214" cy="67" rx="22" ry="11"/>
  </g>
  <g fill="#fef9c3">
    <circle cx="380" cy="40" r="2.5"/>
    <circle cx="420" cy="92" r="2"/>
    <circle cx="455" cy="30" r="3"/>
    <circle cx="470" cy="120" r="2"/>
    <circle cx="560" cy="150" r="2.5"/>
    <circle cx="400" cy="140" r="2"/>
    <circle cx="590" cy="40" r="2"/>
  </g>
  <circle cx="530" cy="76" r="36" fill="#e0e7ff"/>
  <circle cx="547" cy="66" r="32" fill="#312e81"/>

  <!-- hills + ground -->
  <path d="M0 250 Q80 200 170 245 T340 240 T480 236 T600 244 L600 290 L0 290 Z" fill="#15803d" opacity="0.55"/>
  <rect x="0" y="282" width="600" height="118" fill="url(#tw-grass)"/>
  <rect x="0" y="330" width="600" height="70" fill="#000000" opacity="0.12"/>

  <!-- mud pit -->
  <ellipse cx="300" cy="296" rx="64" ry="18" fill="#a16207" opacity="0.6"/>
  <ellipse cx="300" cy="296" rx="54" ry="14" fill="url(#tw-mud)"/>
  <circle cx="284" cy="294" r="4" fill="#a16207"/>
  <circle cx="314" cy="298" r="3" fill="#a16207"/>

  <!-- rope (shifted toward Team Moon: Sun is winning) -->
