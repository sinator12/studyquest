  <g transform="translate(398 290) rotate(8)">
    <path d="M2 -30 L16 0" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    <path d="M-4 -30 L-12 0" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="0" cy="-50" rx="17" ry="22" fill="#818cf8" stroke="#4338ca" stroke-width="3"/>
    <path d="M3 -58 A8 8 0 1 0 3 -42 A6 6 0 1 1 3 -58 Z" fill="#e0e7ff"/>
    <path d="M-5 -62 Q-20 -60 -30 -54" stroke="#a86b3c" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-4" cy="-82" r="14" fill="#a86b3c"/>
    <path d="M-22 -86 Q-4 -94 14 -86 L14 -82 Q-4 -90 -22 -82 Z" fill="#4338ca"/>
    <circle cx="-9" cy="-83" r="2.6" fill="#111827"/>
