    <ellipse cx="0" cy="-50" rx="17" ry="22" fill="#818cf8" stroke="#4338ca" stroke-width="3"/>
    <path d="M3 -58 A8 8 0 1 0 3 -42 A6 6 0 1 1 3 -58 Z" fill="#e0e7ff"/>
    <path d="M-5 -62 Q-20 -60 -30 -54" stroke="#7a4a26" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-4" cy="-82" r="14" fill="#7a4a26"/>
    <path d="M-22 -86 Q-4 -94 14 -86 L14 -82 Q-4 -90 -22 -82 Z" fill="#4338ca"/>
    <path d="M-4 -84 l-5 1.5 M-12 -83 l-5 -1.5" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-14" y="-77" width="9" height="4" rx="1.5" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  </g>
  <g transform="translate(520 290) rotate(16)">
    <path d="M2 -30 L16 0" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
    <path d="M-4 -30 L-12 0" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="0" cy="-50" rx="17" ry="22" fill="#818cf8" stroke="#4338ca" stroke-width="3"/>
    <path d="M3 -58 A8 8 0 1 0 3 -42 A6 6 0 1 1 3 -58 Z" fill="#e0e7ff"/>
    <path d="M-5 -62 Q-20 -60 -30 -54" stroke="#f7d7b5" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-4" cy="-82" r="14" fill="#f7d7b5"/>
    <path d="M-22 -86 Q-4 -94 14 -86 L14 -82 Q-4 -90 -22 -82 Z" fill="#4338ca"/>
    <path d="M-4 -84 l-5 1.5 M-12 -83 l-5 -1.5" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-14" y="-77" width="9" height="4" rx="1.5" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  </g>
</svg>
