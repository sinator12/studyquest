    <ellipse cx="0" cy="-50" rx="17" ry="22" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <circle cx="0" cy="-50" r="6" fill="#fde68a"/>
    <path d="M5 -62 Q20 -60 30 -54" stroke="#d9a273" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="4" cy="-82" r="14" fill="#d9a273"/>
    <path d="M-14 -86 Q4 -94 22 -86 L22 -82 Q4 -90 -14 -82 Z" fill="#b45309"/>
    <path d="M4 -84 l5 1.5 M12 -83 l5 -1.5" stroke="#111827" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="5" y="-77" width="9" height="4" rx="1.5" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
