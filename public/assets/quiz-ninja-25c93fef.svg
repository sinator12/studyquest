<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="qn-bg" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#1a0f2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="qn-blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="qn-orb" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </radialGradient>
    <filter id="qn-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="qn-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#qn-bg)"/>
  <!-- dojo light beams -->
  <g opacity="0.12" fill="#a855f7" filter="url(#qn-soft)">
    <polygon points="0,0 200,0 80,400 -40,400"/>
    <polygon points="600,0 420,0 540,400 640,400"/>
  </g>
  <!-- sliced orb halves -->
  <g filter="url(#qn-glow)">
    <path d="M300 130 a70 70 0 0 0 -49 119 l59 -59 z" fill="url(#qn-orb)" transform="translate(-22,18)"/>
    <path d="M300 130 a70 70 0 0 1 49 119 l-59 -59 z" fill="url(#qn-orb)" transform="translate(22,18)"/>
    <line x1="248" y1="118" x2="352" y2="282" stroke="#1a0f2e" stroke-width="6" opacity="0.6"/>
  </g>
  <!-- blade slash arc -->
  <path d="M70 330 Q 250 60 540 110" fill="none" stroke="url(#qn-blade)" stroke-width="10" stroke-linecap="round" filter="url(#qn-glow)"/>
  <path d="M70 330 Q 250 60 540 110" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- spark particles -->
  <g fill="#67e8f9" filter="url(#qn-glow)">
    <circle cx="300" cy="200" r="4"/>
    <circle cx="350" cy="160" r="3"/><circle cx="260" cy="245" r="3"/>
    <circle cx="390" cy="220" r="2.5"/><circle cx="220" cy="180" r="2.5"/>
  </g>
  <g fill="#f9a8d4" filter="url(#qn-glow)">
    <path d="M300 165 l3 10 10 3 -10 3 -3 10 -3 -10 -10 -3 10 -3z"/>
    <circle cx="420" cy="170" r="2.5"/><circle cx="190" cy="230" r="2.5"/>
  </g>
</svg>
