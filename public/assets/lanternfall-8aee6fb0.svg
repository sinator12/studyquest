<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="lf-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.55" stop-color="#10173a"/>
      <stop offset="1" stop-color="#1b2450"/>
    </linearGradient>
    <linearGradient id="lf-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a3e"/>
      <stop offset="1" stop-color="#070b20"/>
    </linearGradient>
    <radialGradient id="lf-lantern-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd89a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffb856" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb856" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lf-moon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#lf-sky)"/>

  <!-- stars -->
  <g fill="#a9c1ff">
    <circle cx="42" cy="38" r="1.6" opacity="0.85"/><circle cx="118" cy="72" r="1.1" opacity="0.6"/>
    <circle cx="205" cy="30" r="1.3" opacity="0.7"/><circle cx="268" cy="88" r="1" opacity="0.5"/>
    <circle cx="330" cy="42" r="1.7" opacity="0.9"/><circle cx="398" cy="24" r="1.1" opacity="0.6"/>
    <circle cx="452" cy="66" r="1.4" opacity="0.75"/><circle cx="520" cy="34" r="1" opacity="0.55"/>
    <circle cx="560" cy="96" r="1.5" opacity="0.8"/><circle cx="86" cy="120" r="1" opacity="0.5"/>
    <circle cx="486" cy="128" r="1.1" opacity="0.6"/><circle cx="176" cy="132" r="0.9" opacity="0.45"/>
  </g>

  <!-- moon -->
  <circle cx="110" cy="84" r="58" fill="url(#lf-moon-glow)"/>
  <circle cx="110" cy="84" r="26" fill="#e9edfb" opacity="0.95"/>
  <circle cx="102" cy="76" r="5" fill="#c9d2ec" opacity="0.5"/>
  <circle cx="120" cy="92" r="4" fill="#c9d2ec" opacity="0.4"/>

  <!-- far ridge -->
  <path d="M0,208 C60,190 120,198 180,186 C250,172 320,196 390,184 C460,172 530,192 600,178 L600,400 L0,400 Z" fill="#2a3260"/>
  <!-- mid ridge with pines -->
  <path d="M0,244 C80,232 150,246 230,236 C320,224 420,244 600,230 L600,400 L0,400 Z" fill="#1f2750"/>
  <g fill="#1f2750">
    <path d="M96,238 l10,-24 l10,24 Z M99,224 l7,-17 l7,17 Z"/>
    <path d="M158,236 l9,-21 l9,21 Z M161,224 l6,-15 l6,15 Z"/>
    <path d="M420,232 l11,-26 l11,26 Z M424,217 l7,-17 l7,17 Z"/>
    <path d="M486,234 l9,-21 l9,21 Z"/>
  </g>

  <!-- water -->
  <rect y="290" width="600" height="110" fill="url(#lf-water)"/>
  <ellipse cx="452" cy="302" rx="70" ry="5" fill="#ffb856" opacity="0.16"/>
  <ellipse cx="452" cy="312" rx="46" ry="3.4" fill="#ffb856" opacity="0.1"/>
  <ellipse cx="188" cy="316" rx="60" ry="4" fill="#9be8ff" opacity="0.07"/>

  <!-- near bank + reeds -->
  <path d="M0,306 C60,296 110,304 170,300 C150,306 90,312 0,314 Z" fill="#0c112b"/>
  <path d="M600,296 C560,290 530,296 500,294 C540,300 570,304 600,306 Z" fill="#0c112b"/>
  <g stroke="#0c112b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M28,306 q2,-20 8,-28"/><path d="M40,308 q-2,-18 -8,-26"/><path d="M572,300 q2,-16 7,-22"/>
  </g>

  <!-- the wicklight, lit -->
  <g>
    <circle cx="452" cy="216" r="64" fill="url(#lf-lantern-glow)"/>
    <path d="M446,300 L448,190 L456,190 L458,300 Z" fill="#0c112b"/>
    <path d="M452,190 Q452,168 468,162" stroke="#0c112b" stroke-width="5" fill="none"/>
    <g>
      <polygon points="468,150 482,158 482,176 468,184 454,176 454,158" fill="#ffd89a"/>
      <polygon points="460,150 476,150 468,140" fill="#0c112b"/>
      <circle cx="468" cy="167" r="7" fill="#fff3d0"/>
    </g>
  </g>

  <!-- the skiff with the Keeper and Glim -->
  <g>
    <ellipse cx="216" cy="342" rx="66" ry="8" fill="#ffb856" opacity="0.12"/>
    <path d="M152,322 Q158,342 190,346 L250,346 Q282,342 292,318 Q262,332 240,334 L182,334 Q164,330 152,322 Z" fill="#0a0f26"/>
    <circle cx="212" cy="300" r="9" fill="#0a0f26"/>
    <path d="M198,332 Q198,306 212,294 Q226,304 228,332 Z" fill="#0a0f26"/>
    <path d="M252,332 Q258,290 272,268" stroke="#0a0f26" stroke-width="4.5" fill="none"/>
    <circle cx="278" cy="282" r="26" fill="url(#lf-lantern-glow)"/>
    <polygon points="278,270 288,276 288,290 278,296 268,290 268,276" fill="#ffd89a"/>
    <circle cx="278" cy="283" r="5" fill="#fff3d0"/>
    <!-- Glim -->
    <g fill="#dff4ff">
      <circle cx="244" cy="256" r="10" opacity="0.25"/>
      <ellipse cx="240" cy="255" rx="6" ry="3.4" transform="rotate(-25 240 255)"/>
      <ellipse cx="249" cy="255" rx="6" ry="3.4" transform="rotate(25 249 255)"/>
      <ellipse cx="244.5" cy="258" rx="1.8" ry="4"/>
    </g>
  </g>

  <!-- fireflies -->
  <g fill="#ffd77a">
    <circle cx="352" cy="252" r="2.4" opacity="0.9"/><circle cx="376" cy="272" r="1.6" opacity="0.6"/>
    <circle cx="320" cy="288" r="1.8" opacity="0.7"/><circle cx="512" cy="248" r="2" opacity="0.8"/>
    <circle cx="540" cy="270" r="1.4" opacity="0.5"/><circle cx="404" cy="238" r="1.5" opacity="0.55"/>
    <circle cx="124" cy="262" r="1.7" opacity="0.6"/><circle cx="64" cy="242" r="1.4" opacity="0.5"/>
  </g>
</svg>
