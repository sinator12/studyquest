<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Brain Breaker">
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1024"/>
      <stop offset="0.6" stop-color="#0e1330"/>
      <stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="bb-pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="bb-ball" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="bb-glow" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="bb-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bb-bg)"/>
  <rect width="600" height="400" fill="url(#bb-glow)"/>

  <!-- starfield -->
  <g fill="#dbeafe" opacity="0.5">
    <circle cx="70" cy="60" r="1.5"/><circle cx="520" cy="40" r="1.2"/><circle cx="320" cy="30" r="1"/>
    <circle cx="160" cy="220" r="1.2"/><circle cx="470" cy="250" r="1.4"/><circle cx="40" cy="300" r="1"/>
    <circle cx="560" cy="180" r="1.2"/><circle cx="250" cy="160" r="1"/>
  </g>

  <!-- brick field -->
  <g>
    <!-- row 1 (red) -->
    <rect x="60"  y="56" width="86" height="26" rx="6" fill="#fb7185"/>
    <rect x="156" y="56" width="86" height="26" rx="6" fill="#fb7185"/>
    <rect x="252" y="56" width="86" height="26" rx="6" fill="#f43f5e"/>
    <!-- golden quiz brick with glow -->
    <rect x="348" y="50" width="98" height="38" rx="8" fill="#fbbf24" filter="url(#bb-soft)" opacity="0.7"/>
    <rect x="350" y="52" width="94" height="34" rx="7" fill="#fcd34d"/>
    <text x="397" y="76" font-family="system-ui, sans-serif" font-size="26" font-weight="900" fill="#3b2400" text-anchor="middle">?</text>
    <rect x="456" y="56" width="86" height="26" rx="6" fill="#fb7185"/>
    <!-- row 2 (amber) -->
    <rect x="60"  y="92" width="86" height="26" rx="6" fill="#fbbf24"/>
    <rect x="156" y="92" width="86" height="26" rx="6" fill="#f59e0b"/>
    <rect x="252" y="92" width="86" height="26" rx="6" fill="#fbbf24"/>
    <rect x="456" y="92" width="86" height="26" rx="6" fill="#f59e0b"/>
    <!-- row 3 (emerald) -->
    <rect x="60"  y="128" width="86" height="26" rx="6" fill="#34d399"/>
    <rect x="156" y="128" width="86" height="26" rx="6" fill="#10b981"/>
    <rect x="252" y="128" width="86" height="26" rx="6" fill="#34d399"/>
    <rect x="348" y="128" width="86" height="26" rx="6" fill="#10b981"/>
    <rect x="444" y="128" width="86" height="26" rx="6" fill="#34d399"/>
    <!-- row 4 (violet) -->
    <rect x="108" y="164" width="86" height="26" rx="6" fill="#a78bfa"/>
    <rect x="204" y="164" width="86" height="26" rx="6" fill="#8b5cf6"/>
    <rect x="300" y="164" width="86" height="26" rx="6" fill="#a78bfa"/>
    <rect x="396" y="164" width="86" height="26" rx="6" fill="#8b5cf6"/>
  </g>

  <!-- ball with motion trail -->
  <g>
    <circle cx="300" cy="300" r="18" fill="#f59e0b" opacity="0.25" filter="url(#bb-soft)"/>
    <circle cx="338" cy="262" r="6" fill="#f59e0b" opacity="0.25"/>
    <circle cx="356" cy="244" r="4" fill="#f59e0b" opacity="0.18"/>
    <circle cx="300" cy="300" r="11" fill="url(#bb-ball)"/>
  </g>

  <!-- paddle -->
  <g>
    <rect x="232" y="346" width="136" height="22" rx="11" fill="#6366f1" opacity="0.3" filter="url(#bb-soft)"/>
    <rect x="240" y="348" width="120" height="16" rx="8" fill="url(#bb-pad)"/>
  </g>
</svg>
