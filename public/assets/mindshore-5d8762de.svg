<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="ms-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8e3"/>
      <stop offset="0.28" stop-color="#a9d8e8"/>
      <stop offset="0.44" stop-color="#eed0ac"/>
      <stop offset="0.53" stop-color="#f6d7b0"/>
      <stop offset="1" stop-color="#f6d7b0"/>
    </linearGradient>
    <radialGradient id="ms-sunHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ffd97a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ms-sunCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.7" stop-color="#ffedb8"/>
      <stop offset="1" stop-color="#ffd97a"/>
    </radialGradient>
    <linearGradient id="ms-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c8c99"/>
      <stop offset="0.45" stop-color="#1f5f77"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="ms-glint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffd97a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="ms-beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ffe9b0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ms-beamWide" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ms-obeliskGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ms-bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd97a" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#ffe9b0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd97a" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="ms-vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1f33" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="ms-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ms-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- dawn sky -->
  <rect width="600" height="400" fill="url(#ms-sky)"/>

  <!-- low sun with layered glow, just above the horizon -->
  <circle cx="395" cy="185" r="150" fill="url(#ms-sunHalo)" opacity="0.7"/>
  <circle cx="395" cy="185" r="80" fill="url(#ms-sunHalo)"/>
  <circle cx="395" cy="185" r="26" fill="url(#ms-sunCore)"/>

  <!-- thin dawn clouds, kept off the upper-left title zone -->
  <g fill="#fdeacb" filter="url(#ms-soft)">
    <ellipse cx="330" cy="92" rx="58" ry="6" opacity="0.4"/>
    <ellipse cx="382" cy="80" rx="34" ry="4.5" opacity="0.3"/>
    <ellipse cx="510" cy="62" rx="46" ry="5" opacity="0.32"/>
    <ellipse cx="255" cy="128" rx="40" ry="4.5" opacity="0.22"/>
  </g>

  <!-- far islands, desaturated silhouettes fading into mist -->
  <g>
    <g transform="translate(100,210)" opacity="0.55">
      <path d="M-62 0 L-40 -22 L-18 -34 L4 -26 L26 -12 L44 0 Z" fill="#a7bcc6"/>
      <path d="M-18 -34 L-8 -46 L0 -34 Z" fill="#9db3bf"/>
    </g>
    <g transform="translate(235,210)" opacity="0.72">
      <path d="M-52 0 L-34 -20 L-12 -32 L10 -24 L30 -10 L44 0 Z" fill="#8fa9b6"/>
      <path d="M-12 -32 L-4 -44 L6 -30 Z" fill="#84a0ae"/>
      <!-- dormant beacon spark on the far isle -->
      <circle cx="-4" cy="-47" r="2.2" fill="#ffe9b0" opacity="0.85" filter="url(#ms-glow)"/>
    </g>
  </g>

  <!-- calm gradient sea -->
  <rect y="210" width="600" height="190" fill="url(#ms-sea)"/>

  <!-- sun-glint path widening toward the viewer -->
  <path d="M390 211 L400 211 L426 400 L362 400 Z" fill="url(#ms-glint)"/>
  <g fill="#ffe9b0" opacity="0.45">
    <ellipse cx="394" cy="228" rx="12" ry="1.4"/>
    <ellipse cx="399" cy="250" rx="15" ry="1.7"/>
    <ellipse cx="390" cy="276" rx="18" ry="2"/>
    <ellipse cx="397" cy="310" rx="22" ry="2.4"/>
    <ellipse cx="388" cy="352" rx="26" ry="2.8"/>
  </g>

  <!-- subtle wave lines -->
  <g fill="none" stroke="#cfeef0" stroke-linecap="round">
    <path d="M40 236 q14 -3 28 0 t28 0" stroke-width="1.4" opacity="0.22"/>
    <path d="M170 252 q16 -3 32 0 t32 0" stroke-width="1.5" opacity="0.2"/>
    <path d="M60 286 q18 -4 36 0 t36 0" stroke-width="1.8" opacity="0.22"/>
    <path d="M250 336 q22 -5 44 0 t44 0" stroke-width="2.2" opacity="0.2"/>
    <path d="M80 356 q24 -5 48 0 t48 0" stroke-width="2.4" opacity="0.24"/>
    <path d="M480 262 q16 -3 32 0 t32 0" stroke-width="1.6" opacity="0.2"/>
    <path d="M500 330 q20 -4 40 0 t40 0" stroke-width="2.2" opacity="0.22"/>
    <path d="M140 388 q26 -6 52 0 t52 0" stroke-width="2.6" opacity="0.26"/>
  </g>

  <!-- glowing light-bridge arcing from the far isle to the near island -->
  <g>
    <path d="M240 196 Q330 106 462 138" fill="none" stroke="#ffe9b0" stroke-width="6"
          opacity="0.28" filter="url(#ms-soft)"/>
    <path d="M240 196 Q330 106 462 138" fill="none" stroke="url(#ms-bridge)"
          stroke-width="2.4" stroke-linecap="round"/>
    <path d="M240 196 Q330 106 462 138" fill="none" stroke="#fff4d6" stroke-width="1.2"
          stroke-linecap="round" stroke-dasharray="2 10" opacity="0.85"/>
  </g>

  <!-- near island reflection in the water -->
  <g opacity="0.32" filter="url(#ms-soft)">
    <path d="M362 302 L400 330 L470 344 L545 332 L578 306 Z" fill="#0f2b40"/>
    <rect x="459" y="304" width="5" height="52" fill="#ffd97a" opacity="0.55"/>
  </g>

  <!-- near island: lush low-poly, right of center -->
  <g transform="translate(470,300)">
    <!-- faceted rock base, sunlit from the left -->
    <path d="M-110 2 L-72 -42 L-38 -66 L-40 2 Z" fill="#c9a876"/>
    <path d="M-40 2 L-38 -66 L8 -78 L14 2 Z" fill="#a9835a"/>
    <path d="M14 2 L8 -78 L56 -58 L64 2 Z" fill="#7d6247"/>
    <path d="M64 2 L56 -58 L92 -28 L110 2 Z" fill="#5f4a34"/>
    <!-- waterline foam -->
    <path d="M-112 2 Q-40 10 0 8 Q60 10 112 2" fill="none" stroke="#d8f3f2" stroke-width="2.5" opacity="0.5"/>
    <!-- lush faceted meadow cap -->
    <path d="M-72 -42 L-38 -66 L-8 -74 L-30 -46 Z" fill="#5cbf7e"/>
    <path d="M-30 -46 L-8 -74 L8 -78 L34 -64 L18 -44 Z" fill="#3f9d63"/>
    <path d="M18 -44 L34 -64 L56 -58 L44 -38 Z" fill="#2c7a4b"/>
    <path d="M-72 -42 L-30 -46 L18 -44 L44 -38 L56 -58 L92 -28 L64 -22 L-4 -26 L-58 -28 Z" fill="#35895a"/>
    <!-- tiny stylized trees -->
    <g>
      <g transform="translate(-58,-46)">
        <rect x="-1.5" y="-3" width="3" height="6" fill="#5b3d22"/>
        <path d="M-8 -2 L0 -18 L8 -2 Z" fill="#2e8653"/>
        <path d="M-6 -10 L0 -24 L6 -10 Z" fill="#4fb573"/>
      </g>
      <g transform="translate(-24,-72)">
        <rect x="-1.5" y="-3" width="3" height="6" fill="#5b3d22"/>
        <path d="M-7 -2 L0 -16 L7 -2 Z" fill="#2e8653"/>
        <path d="M-5 -9 L0 -21 L5 -9 Z" fill="#4fb573"/>
      </g>
      <g transform="translate(34,-58)">
        <rect x="-1.5" y="-3" width="3" height="6" fill="#5b3d22"/>
        <path d="M-8 -2 L0 -18 L8 -2 Z" fill="#256e44"/>
        <path d="M-6 -10 L0 -23 L6 -10 Z" fill="#3f9d63"/>
      </g>
      <g transform="translate(58,-32)">
        <rect x="-1.5" y="-2" width="3" height="5" fill="#5b3d22"/>
        <path d="M-6 -1 L0 -13 L6 -1 Z" fill="#1f5d3a"/>
      </g>
      <g transform="translate(-84,-34)">
        <rect x="-1.5" y="-2" width="3" height="5" fill="#5b3d22"/>
        <path d="M-6 -1 L0 -14 L6 -1 Z" fill="#2e8653"/>
      </g>
    </g>
    <!-- glowing obelisk anchor with light beam -->
    <g>
      <rect x="-16" y="-268" width="28" height="180" fill="url(#ms-beamWide)"/>
      <rect x="-5" y="-262" width="6" height="174" fill="url(#ms-beam)"/>
      <ellipse cx="-2" cy="-120" rx="34" ry="46" fill="url(#ms-obeliskGlow)" opacity="0.75"/>
      <path d="M-11 -86 L-2 -164 L-2 -86 Z" fill="#fff3d0"/>
      <path d="M-2 -86 L-2 -164 L8 -86 Z" fill="#ffcf66"/>
      <path d="M-11 -86 L-2 -92 L8 -86 Z" fill="#e0a94f"/>
      <!-- beacon light at the tip -->
      <circle cx="-2" cy="-166" r="4.5" fill="#fffdf4" filter="url(#ms-glow)"/>
    </g>
    <!-- runestone pebbles at the obelisk's foot -->
    <g fill="#d9c39a">
      <path d="M-20 -84 L-15 -92 L-10 -84 Z" opacity="0.9"/>
      <path d="M12 -84 L17 -91 L22 -84 Z" opacity="0.8"/>
    </g>
  </g>

  <!-- drifting mist bands over the horizon and far isles -->
  <g fill="#e2e8f0" filter="url(#ms-soft)">
    <ellipse cx="150" cy="208" rx="180" ry="10" opacity="0.28"/>
    <ellipse cx="300" cy="216" rx="220" ry="7" opacity="0.16"/>
    <ellipse cx="60" cy="196" rx="110" ry="7" opacity="0.22"/>
    <ellipse cx="480" cy="226" rx="150" ry="7" opacity="0.1"/>
    <ellipse cx="240" cy="188" rx="90" ry="5" opacity="0.15"/>
  </g>

  <!-- fireflies drifting around the near island -->
  <g fill="#ffd97a" filter="url(#ms-glow)">
    <circle cx="382" cy="150" r="2.2" opacity="0.9"/>
    <circle cx="428" cy="120" r="1.6" opacity="0.7"/>
    <circle cx="512" cy="168" r="2" opacity="0.85"/>
    <circle cx="556" cy="216" r="1.5" opacity="0.65"/>
    <circle cx="470" cy="96" r="1.4" opacity="0.6"/>
    <circle cx="345" cy="192" r="1.8" opacity="0.75"/>
    <circle cx="540" cy="140" r="1.3" opacity="0.55"/>
    <circle cx="404" cy="176" r="1.5" opacity="0.7"/>
  </g>

  <rect width="600" height="400" fill="url(#ms-vignette)"/>
</svg>
