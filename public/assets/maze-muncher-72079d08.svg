<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="mz-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a3a"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#080a18"/>
    </linearGradient>
    <linearGradient id="mz-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="mz-muncher" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#fff6b8"/>
      <stop offset="0.5" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#f5b70a"/>
    </radialGradient>
    <radialGradient id="mz-orbA" cx="0.4" cy="0.32" r="0.85"><stop offset="0" stop-color="#bfdbfe"/><stop offset="0.55" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></radialGradient>
    <radialGradient id="mz-orbB" cx="0.4" cy="0.32" r="0.85"><stop offset="0" stop-color="#fbcfe8"/><stop offset="0.55" stop-color="#f472b6"/><stop offset="1" stop-color="#db2777"/></radialGradient>
    <radialGradient id="mz-orbC" cx="0.4" cy="0.32" r="0.85"><stop offset="0" stop-color="#a7f3d0"/><stop offset="0.55" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></radialGradient>
    <radialGradient id="mz-orbD" cx="0.4" cy="0.32" r="0.85"><stop offset="0" stop-color="#fde68a"/><stop offset="0.55" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/></radialGradient>
    <filter id="mz-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mz-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#mz-bg)"/>
  <!-- arcade floor glow -->
  <ellipse cx="300" cy="392" rx="330" ry="120" fill="#3b82f6" opacity="0.16" filter="url(#mz-soft)"/>
  <!-- ambient star dots -->
  <g fill="#bfdbfe" opacity="0.85">
    <circle cx="70" cy="46" r="1.5"/><circle cx="150" cy="30" r="1"/><circle cx="500" cy="42" r="1.5"/>
    <circle cx="548" cy="96" r="1"/><circle cx="52" cy="150" r="1"/><circle cx="470" cy="70" r="1"/>
  </g>
  <!-- neon maze walls (rounded corridor segments, glowing) -->
  <g fill="none" stroke="url(#mz-wall)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#mz-glow)">
    <!-- outer frame -->
    <rect x="40" y="40" width="520" height="320" rx="26"/>
    <!-- top-left block -->
    <path d="M104 104 H196 V168 H104 Z"/>
    <!-- top-right block -->
    <path d="M300 104 H496 V150 M404 104 V150"/>
    <!-- centre ghost pen -->
    <rect x="252" y="176" width="96" height="66" rx="12"/>
    <!-- left corridor spur -->
    <path d="M104 232 H168 V300 H104"/>
    <!-- right corridor spur -->
    <path d="M496 220 H432 V300 H520"/>
    <!-- bottom bridge -->
    <path d="M232 300 H300 M348 300 H420"/>
  </g>
  <!-- inner wall highlight for crisp neon core -->
  <g fill="none" stroke="#dbeafe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <rect x="40" y="40" width="520" height="320" rx="26"/>
    <rect x="252" y="176" width="96" height="66" rx="12"/>
  </g>
  <!-- pellet trail along an open corridor -->
  <g fill="#fde68a" filter="url(#mz-glow)">
    <circle cx="150" cy="200" r="4"/><circle cx="186" cy="200" r="4"/><circle cx="222" cy="200" r="4"/>
    <circle cx="258" cy="330" r="4"/><circle cx="300" cy="330" r="4.5"/><circle cx="342" cy="330" r="4"/>
    <circle cx="384" cy="330" r="4"/>
  </g>
  <!-- lettered answer orbs (glowing discs) -->
  <g font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" filter="url(#mz-glow)">
    <g>
      <circle cx="150" cy="330" r="20" fill="url(#mz-orbA)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="150" y="337" font-size="19" fill="#ffffff">A</text>
    </g>
    <g>
      <circle cx="450" cy="140" r="20" fill="url(#mz-orbB)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="450" y="147" font-size="19" fill="#ffffff">B</text>
    </g>
    <g>
      <circle cx="470" cy="330" r="20" fill="url(#mz-orbC)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="470" y="337" font-size="19" fill="#ffffff">C</text>
    </g>
    <g>
      <circle cx="140" cy="140" r="20" fill="url(#mz-orbD)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="140" y="147" font-size="19" fill="#052e16">D</text>
    </g>
  </g>
  <!-- ghosts -->
  <!-- red ghost -->
  <g transform="translate(300,150)" filter="url(#mz-glow)">
    <path d="M-24 4 Q-24 -26 0 -26 Q24 -26 24 4 L24 22 Q18 15 12 22 Q6 29 0 22 Q-6 15 -12 22 Q-18 29 -24 22 Z" fill="#ff5560"/>
    <circle cx="-9" cy="-6" r="6" fill="#ffffff"/><circle cx="9" cy="-6" r="6" fill="#ffffff"/>
    <circle cx="-7" cy="-5" r="3" fill="#1e1b4b"/><circle cx="11" cy="-5" r="3" fill="#1e1b4b"/>
  </g>
  <!-- cyan ghost -->
  <g transform="translate(392,240)" filter="url(#mz-glow)">
    <path d="M-22 4 Q-22 -24 0 -24 Q22 -24 22 4 L22 20 Q16 14 11 20 Q6 26 0 20 Q-6 14 -11 20 Q-16 26 -22 20 Z" fill="#57e8ff"/>
    <circle cx="-8" cy="-5" r="5.5" fill="#ffffff"/><circle cx="8" cy="-5" r="5.5" fill="#ffffff"/>
    <circle cx="-6" cy="-4" r="2.8" fill="#0e7490"/><circle cx="10" cy="-4" r="2.8" fill="#0e7490"/>
  </g>
  <!-- pink ghost -->
  <g transform="translate(212,258)" filter="url(#mz-glow)">
    <path d="M-22 4 Q-22 -24 0 -24 Q22 -24 22 4 L22 20 Q16 14 11 20 Q6 26 0 20 Q-6 14 -11 20 Q-16 26 -22 20 Z" fill="#ffb0e0"/>
    <circle cx="-8" cy="-5" r="5.5" fill="#ffffff"/><circle cx="8" cy="-5" r="5.5" fill="#ffffff"/>
    <circle cx="-6" cy="-4" r="2.8" fill="#9d174d"/><circle cx="10" cy="-4" r="2.8" fill="#9d174d"/>
  </g>
  <!-- friendly yellow muncher, mouth chomping right toward the pellets -->
  <g transform="translate(292,330)" filter="url(#mz-glow)">
    <ellipse cx="0" cy="32" rx="40" ry="9" fill="#ffe14d" opacity="0.3" filter="url(#mz-soft)"/>
    <path d="M0 0 L33 -19 A34 34 0 1 0 33 19 Z" fill="url(#mz-muncher)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="-2" cy="-15" r="4.5" fill="#3b2a02"/>
  </g>
  <!-- sparkle accents -->
  <g fill="#fef9c3" filter="url(#mz-glow)">
    <path d="M258 90 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M520 200 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z"/>
    <circle cx="86" cy="270" r="2.5"/><circle cx="516" cy="120" r="2.5"/>
  </g>
</svg>
