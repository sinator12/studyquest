<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="pf-room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.7" stop-color="#0f0a2e"/>
      <stop offset="1" stop-color="#050214"/>
    </linearGradient>
    <radialGradient id="pf-beam" cx="0.32" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#fde68a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pf-cone" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pf-ghost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="pf-ghost2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e7ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="pf-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="pf-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- dark manor room -->
  <rect width="600" height="400" fill="url(#pf-room)"/>
  <!-- wall paneling hints -->
  <g stroke="#312e81" stroke-width="2" opacity="0.5">
    <line x1="0" y1="320" x2="600" y2="320"/>
    <rect x="30" y="60" width="90" height="120" fill="none"/>
    <rect x="470" y="50" width="100" height="140" fill="none"/>
  </g>
  <!-- moonlit window + lightning -->
  <g transform="translate(520,110)">
    <rect x="-44" y="-62" width="88" height="124" rx="8" fill="#312e81"/>
    <rect x="-36" y="-54" width="72" height="108" rx="5" fill="#93c5fd" opacity="0.32"/>
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#312e81" stroke-width="5"/>
    <line x1="-36" y1="0" x2="36" y2="0" stroke="#312e81" stroke-width="5"/>
    <path d="M-6 -48 L4 -22 L-3 -22 L8 6 L1 6 L12 34" fill="none" stroke="#fef9c3" stroke-width="3.5" filter="url(#pf-glow)"/>
  </g>
  <!-- furniture silhouettes -->
  <g fill="#0a0625">
    <rect x="20" y="210" width="86" height="120" rx="4"/>
    <rect x="30" y="222" width="66" height="20" rx="2" fill="#171138"/>
    <rect x="30" y="250" width="66" height="20" rx="2" fill="#171138"/>
    <rect x="30" y="278" width="66" height="20" rx="2" fill="#171138"/>
    <rect x="404" y="236" width="60" height="100" rx="6"/>
    <circle cx="434" cy="262" r="18" fill="#171138"/>
    <line x1="434" y1="262" x2="434" y2="318" stroke="#171138" stroke-width="6"/>
  </g>
  <!-- flashlight beam from bottom-left hand -->
  <polygon points="120,392 320,60 470,180 180,400" fill="url(#pf-cone)"/>
  <ellipse cx="270" cy="170" rx="210" ry="160" fill="url(#pf-beam)"/>
  <g transform="translate(118,386) rotate(-50)">
    <rect x="-14" y="-13" width="52" height="26" rx="9" fill="#334155"/>
    <rect x="34" y="-16" width="14" height="32" rx="4" fill="#475569"/>
    <rect x="46" y="-13" width="6" height="26" fill="#fef9c3" filter="url(#pf-glow)"/>
  </g>
  <!-- dust motes -->
  <g fill="#fef9c3" opacity="0.5">
    <circle cx="220" cy="200" r="2"/><circle cx="260" cy="150" r="1.5"/><circle cx="300" cy="220" r="1.8"/>
    <circle cx="190" cy="260" r="1.4"/><circle cx="330" cy="130" r="1.6"/>
  </g>
  <!-- the lit ghost (correct answer) -->
  <g transform="translate(285,160)" filter="url(#pf-glow)">
    <path d="M-36 6 Q-36 -38 0 -38 Q36 -38 36 6 L36 30 Q27 22 18 30 Q9 38 0 30 Q-9 22 -18 30 Q-27 38 -36 30 Z" fill="url(#pf-ghost)"/>
    <circle cx="-12" cy="-12" r="5" fill="#1e1b4b"/>
    <circle cx="12" cy="-12" r="5" fill="#1e1b4b"/>
    <circle cx="0" cy="12" r="13" fill="#1e1b4b" opacity="0.9"/>
    <text x="0" y="17" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  </g>
  <!-- faint ghosts lurking in the dark -->
  <g opacity="0.55">
    <g transform="translate(110,120) scale(0.8)">
      <path d="M-32 6 Q-32 -34 0 -34 Q32 -34 32 6 L32 26 Q24 19 16 26 Q8 33 0 26 Q-8 19 -16 26 Q-24 33 -32 26 Z" fill="url(#pf-ghost2)"/>
      <circle cx="-10" cy="-10" r="4.5" fill="#312e81"/>
      <circle cx="10" cy="-10" r="4.5" fill="#312e81"/>
      <circle cx="0" cy="10" r="11" fill="#1e1b4b" opacity="0.85"/>
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" text-anchor="middle">A</text>
    </g>
    <g transform="translate(465,300) scale(0.85)">
      <path d="M-32 6 Q-32 -34 0 -34 Q32 -34 32 6 L32 26 Q24 19 16 26 Q8 33 0 26 Q-8 19 -16 26 Q-24 33 -32 26 Z" fill="url(#pf-ghost2)"/>
      <circle cx="-10" cy="-10" r="4.5" fill="#312e81"/>
      <circle cx="10" cy="-10" r="4.5" fill="#312e81"/>
      <circle cx="0" cy="10" r="11" fill="#1e1b4b" opacity="0.85"/>
      <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" text-anchor="middle">D</text>
    </g>
  </g>
  <!-- golden ghost peeking -->
  <g transform="translate(380,310) scale(0.7)" opacity="0.9" filter="url(#pf-glow)">
    <path d="M-32 6 Q-32 -34 0 -34 Q32 -34 32 6 L32 26 Q24 19 16 26 Q8 33 0 26 Q-8 19 -16 26 Q-24 33 -32 26 Z" fill="url(#pf-gold)"/>
    <circle cx="-10" cy="-10" r="4.5" fill="#78350f"/>
    <circle cx="10" cy="-10" r="4.5" fill="#78350f"/>
    <circle cx="0" cy="10" r="11" fill="#78350f" opacity="0.85"/>
    <text x="0" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fef3c7" text-anchor="middle">C</text>
    <path d="M30 -34 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z" fill="#fef9c3"/>
  </g>
</svg>
