<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Battleships tactical board</title>
  <desc id="desc">A top-down battleship crosses a brass-trimmed ocean grid in the flat nautical style of the game.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E7"/>
      <stop offset="1" stop-color="#D9A441" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E8B8B"/>
      <stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#2E8B8B" fill-opacity=".32"/>
      <rect width="17" height="17" fill="#FFF8E7" fill-opacity=".045"/>
      <rect x="17" y="17" width="17" height="17" fill="#FFF8E7" fill-opacity=".045"/>
      <path d="M34 0H0V34" fill="none" stroke="#1E3A5F" stroke-opacity=".7" stroke-width="1.5"/>
    </pattern>
    <filter id="board-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1E3A5F" flood-opacity=".3"/>
    </filter>
  </defs>

  <!-- The same quiet golden-hour horizon used by the mode and battle screens. -->
  <rect width="600" height="185" fill="url(#sky)"/>
  <circle cx="520" cy="104" r="55" fill="#D9A441" fill-opacity=".34"/>
  <circle cx="520" cy="104" r="33" fill="#FFF8E7" fill-opacity=".45"/>
  <g fill="none" stroke="#1E3A5F" stroke-linecap="round" stroke-width="4" opacity=".78">
    <path d="M58 78q10-12 20 0q10-12 20 0"/>
    <path d="M134 116q7-9 14 0q7-9 14 0"/>
  </g>

  <rect y="174" width="600" height="226" fill="url(#sea)"/>
  <path d="M0 174H600" stroke="#FFF8E7" stroke-opacity=".48" stroke-width="3"/>
  <g fill="none" stroke="#FFF8E7" stroke-linecap="round" opacity=".15">
    <path d="M20 354q20-10 40 0t40 0" stroke-width="5"/>
    <path d="M485 330q20-10 40 0t40 0" stroke-width="5"/>
  </g>

  <!-- A real 10 x 10 board is the hero, matching the core play screen. -->
  <g transform="translate(225 30) rotate(2 170 170)" filter="url(#board-shadow)">
    <rect x="-9" y="-9" width="358" height="358" rx="24" fill="#1E3A5F"/>
    <rect x="-3" y="-3" width="346" height="346" rx="18" fill="none" stroke="#D9A441" stroke-width="5"/>
    <rect width="340" height="340" rx="14" fill="url(#grid)"/>

    <!-- Misses and one coral hit keep the image recognisably Battleships. -->
    <g fill="none" stroke="#FFF8E7" stroke-width="4" stroke-linecap="round" opacity=".72">
      <path d="M50 52l12 12m0-12L50 64"/>
      <path d="M286 256l12 12m0-12-12 12"/>
      <circle cx="85" cy="289" r="7"/>
    </g>
    <g transform="translate(273 92)">
      <circle r="17" fill="#E85D4A"/>
      <circle r="8" fill="#FFF8E7"/>
      <path d="M0-29v12M0 17v12M-29 0h12M17 0h12" stroke="#E85D4A" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Exact top-down visual language of the in-game battleship sprite. -->
    <g transform="translate(75 206) rotate(90) scale(.62)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M50 8C72 16 86 48 86 92v256q0 38-36 42-36-4-36-42V92C14 48 28 16 50 8Z" fill="#1E3A5F" stroke="#FFF8E7" stroke-opacity=".32" stroke-width="8"/>
      <path d="M50 24C66 30 76 54 76 92v244q0 32-26 36-26-4-26-36V92C24 54 34 30 50 24Z" fill="#FFF8E7" stroke="#1E3A5F" stroke-width="4"/>
      <rect x="41.5" y="56" width="6.5" height="58" rx="3" fill="#D9A441" stroke="#1E3A5F" stroke-width="3.5"/>
      <rect x="52" y="56" width="6.5" height="58" rx="3" fill="#D9A441" stroke="#1E3A5F" stroke-width="3.5"/>
      <circle cx="50" cy="128" r="17" fill="#D9A441" stroke="#1E3A5F" stroke-width="4"/>
      <circle cx="50" cy="128" r="4" fill="#1E3A5F"/>
      <rect x="41" y="186" width="18" height="40" rx="7" fill="#1E3A5F"/>
      <rect x="41" y="192" width="18" height="8" fill="#D9A441"/>
      <circle cx="67" cy="180" r="7.5" fill="#FFF8E7"/>
      <circle cx="76" cy="169" r="5" fill="#FFF8E7"/>
      <rect x="41.5" y="286" width="6.5" height="70" rx="3" fill="#D9A441" stroke="#1E3A5F" stroke-width="3.5"/>
      <rect x="52" y="286" width="6.5" height="70" rx="3" fill="#D9A441" stroke="#1E3A5F" stroke-width="3.5"/>
      <circle cx="50" cy="284" r="17" fill="#D9A441" stroke="#1E3A5F" stroke-width="4"/>
      <circle cx="50" cy="284" r="4" fill="#1E3A5F"/>
    </g>
  </g>

  <!-- Pip stays a small UI-style guide, as he is in the actual battle view. -->
  <g transform="translate(34 204)">
    <rect width="148" height="122" rx="22" fill="#1E3A5F" stroke="#D9A441" stroke-width="3"/>
    <g transform="translate(18 13) scale(.38)" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="120" cy="224" rx="34" ry="44" fill="#FFF8E7" stroke="#1E3A5F" stroke-width="5"/>
      <path d="M54 300v-54q0-42 40-52 10 22 12 50v56Z" fill="#1E3A5F"/>
      <path d="M186 300v-54q0-42-40-52-10 22-12 50v56Z" fill="#1E3A5F"/>
      <path d="M150 212q-10-12-2-24l38-46q10-12 22-2 10 10 0 22l-36 42q-10 12-22 8Z" fill="#D9A441" stroke="#1E3A5F" stroke-width="5"/>
      <circle cx="114" cy="116" r="54" fill="#D9A441" stroke="#1E3A5F" stroke-width="5.5"/>
      <ellipse cx="72" cy="122" rx="24" ry="12" transform="rotate(-8 72 122)" fill="#E85D4A" stroke="#1E3A5F" stroke-width="4.5"/>
      <circle cx="140" cy="112" r="13" fill="#1E3A5F"/>
      <circle cx="144.5" cy="107" r="4.5" fill="#FFF8E7"/>
      <g transform="translate(0 -12) rotate(-8 119 97)">
        <ellipse cx="116" cy="54" rx="64" ry="42" fill="#1E3A5F"/>
        <rect x="26" y="82" width="186" height="30" rx="15" fill="#1E3A5F"/>
        <rect x="26" y="104" width="186" height="9" rx="4.5" fill="#D9A441"/>
        <circle cx="58" cy="100" r="10" fill="#D9A441" stroke="#1E3A5F" stroke-width="4"/>
        <circle cx="58" cy="100" r="4.5" fill="#E85D4A"/>
      </g>
    </g>
    <path d="M106 27l18-9-5 20" fill="none" stroke="#D9A441" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
