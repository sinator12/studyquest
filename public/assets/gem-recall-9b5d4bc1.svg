<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#120a22"/>
    </linearGradient>
    <linearGradient id="g-cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="g-mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="g-li" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9f99d"/><stop offset="1" stop-color="#65a30d"/></linearGradient>
    <linearGradient id="g-am" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="g-vi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddd6fe"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="g-or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fed7aa"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <filter id="gr-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#gr-bg)"/>
  <g filter="url(#gr-glow)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5">
    <!-- gem template via use; diamond shape -->
    <g transform="translate(110,90)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-cy)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>
    <g transform="translate(230,90)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-mg)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>
    <g transform="translate(350,90)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-li)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>
    <g transform="translate(470,90)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-am)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>

    <g transform="translate(110,200)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-vi)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>
    <g transform="translate(230,200)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-or)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>
    <g transform="translate(470,200)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-cy)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>

    <g transform="translate(110,310)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-am)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>
    <g transform="translate(230,310)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-cy)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>
    <g transform="translate(350,310)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-mg)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>
    <g transform="translate(470,310)"><polygon points="0,-38 32,-12 0,42 -32,-12" fill="url(#g-li)"/><polygon points="0,-38 32,-12 0,-8 -32,-12" fill="#ffffff" fill-opacity="0.3" stroke="none"/></g>
  </g>
  <!-- shattering gem at 350,200 -->
  <g filter="url(#gr-glow)" stroke="none">
    <polygon points="350,170 360,192 338,196" fill="url(#g-vi)" opacity="0.95"/>
    <polygon points="372,196 384,214 360,212" fill="url(#g-vi)" opacity="0.9"/>
    <polygon points="330,210 348,222 332,236" fill="url(#g-vi)" opacity="0.9"/>
    <polygon points="358,224 372,240 352,242" fill="url(#g-vi)" opacity="0.85"/>
  </g>
  <g fill="#ffffff" filter="url(#gr-glow)">
    <circle cx="392" cy="178" r="3"/><circle cx="318" cy="190" r="2.5"/>
    <circle cx="382" cy="240" r="2.5"/><circle cx="328" cy="246" r="3"/>
    <path d="M350 150 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
  </g>
</svg>
