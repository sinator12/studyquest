<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="nr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="0.6" stop-color="#701a75"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="nr-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="nr-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="nr-car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="nr-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- sky -->
  <rect width="600" height="220" fill="url(#nr-sky)"/>
  <!-- stars -->
  <g fill="#f5d0fe" opacity="0.8">
    <circle cx="60" cy="40" r="1.6"/><circle cx="150" cy="24" r="1.2"/><circle cx="240" cy="56" r="1.4"/>
    <circle cx="420" cy="30" r="1.5"/><circle cx="520" cy="60" r="1.2"/><circle cx="560" cy="24" r="1.6"/>
  </g>
  <!-- banded retro sun -->
  <g filter="url(#nr-glow)">
    <circle cx="300" cy="160" r="78" fill="url(#nr-sun)"/>
    <g fill="#701a75">
      <rect x="222" y="150" width="156" height="7"/>
      <rect x="222" y="166" width="156" height="9"/>
      <rect x="222" y="184" width="156" height="11"/>
      <rect x="222" y="204" width="156" height="13"/>
    </g>
  </g>
  <!-- mountains + skyline -->
  <g fill="#1e1b4b">
    <polygon points="0,220 70,150 140,220"/>
    <polygon points="100,220 190,128 280,220"/>
    <polygon points="320,220 410,140 500,220"/>
    <polygon points="460,220 540,160 600,220 600,220"/>
  </g>
  <g fill="#0f0a2e">
    <rect x="6" y="178" width="26" height="42"/><rect x="40" y="190" width="20" height="30"/>
    <rect x="540" y="182" width="24" height="38"/><rect x="572" y="194" width="18" height="26"/>
  </g>
  <g fill="#f0abfc" opacity="0.85">
    <rect x="11" y="184" width="3" height="3"/><rect x="20" y="192" width="3" height="3"/><rect x="11" y="202" width="3" height="3"/>
    <rect x="546" y="188" width="3" height="3"/><rect x="554" y="198" width="3" height="3"/>
  </g>
  <!-- road -->
  <rect y="220" width="600" height="180" fill="#170b30"/>
  <polygon points="300,220 180,400 420,400" fill="url(#nr-road)"/>
  <polygon points="300,220 186,400 194,400 301,222" fill="#22d3ee" filter="url(#nr-glow)"/>
  <polygon points="300,220 414,400 406,400 299,222" fill="#f0abfc" filter="url(#nr-glow)"/>
  <g fill="#e2e8f0" opacity="0.9">
    <polygon points="299,250 301,250 302,268 298,268"/>
    <polygon points="297,290 303,290 305,316 295,316"/>
    <polygon points="295,344 305,344 308,382 292,382"/>
  </g>
  <!-- neon answer gates -->
  <g font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <g filter="url(#nr-glow)">
      <rect x="220" y="236" width="38" height="34" rx="7" fill="none" stroke="#22d3ee" stroke-width="3.5"/>
      <text x="239" y="259" font-size="17" fill="#a5f3fc">A</text>
    </g>
    <g filter="url(#nr-glow)">
      <rect x="262" y="236" width="38" height="34" rx="7" fill="none" stroke="#f0abfc" stroke-width="3.5"/>
      <text x="281" y="259" font-size="17" fill="#fae8ff">B</text>
    </g>
    <g filter="url(#nr-glow)">
      <rect x="304" y="236" width="38" height="34" rx="7" fill="none" stroke="#bef264" stroke-width="3.5"/>
      <text x="323" y="259" font-size="17" fill="#ecfccb">C</text>
    </g>
    <g filter="url(#nr-glow)">
      <rect x="346" y="236" width="38" height="34" rx="7" fill="none" stroke="#fbbf24" stroke-width="3.5"/>
      <text x="365" y="259" font-size="17" fill="#fef3c7">D</text>
    </g>
  </g>
  <!-- player car (rear view) -->
  <g transform="translate(300,338)">
    <ellipse cx="0" cy="34" rx="62" ry="10" fill="#d946ef" opacity="0.35" filter="url(#nr-glow)"/>
    <path d="M-52 18 Q-54 -2 -38 -8 L-30 -22 Q0 -28 30 -22 L38 -8 Q54 -2 52 18 Q54 30 42 32 L-42 32 Q-54 30 -52 18 Z" fill="url(#nr-car)"/>
    <path d="M-26 -20 Q0 -25 26 -20 L31 -9 Q0 -13 -31 -9 Z" fill="#67e8f9" opacity="0.7"/>
    <rect x="-46" y="6" width="24" height="9" rx="4" fill="#f43f5e" filter="url(#nr-glow)"/>
    <rect x="22" y="6" width="24" height="9" rx="4" fill="#f43f5e" filter="url(#nr-glow)"/>
    <rect x="-50" y="24" width="100" height="4" rx="2" fill="#22d3ee" opacity="0.9" filter="url(#nr-glow)"/>
  </g>
  <!-- speed lines -->
  <g stroke="#f0abfc" stroke-width="3" opacity="0.55" stroke-linecap="round">
    <line x1="30" y1="300" x2="86" y2="290"/>
    <line x1="16" y1="350" x2="90" y2="336"/>
    <line x1="514" y1="296" x2="570" y2="306"/>
    <line x1="510" y1="342" x2="584" y2="356"/>
  </g>
</svg>
