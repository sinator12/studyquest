<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="dv-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a5d9"/>
      <stop offset="0.35" stop-color="#0a5e8f"/>
      <stop offset="0.7" stop-color="#083154"/>
      <stop offset="1" stop-color="#020b18"/>
    </linearGradient>
    <linearGradient id="dv-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d9f6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dv-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="dv-glass" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="0.6" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#075985"/>
    </radialGradient>
    <linearGradient id="dv-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfefff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#bfefff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dv-lure" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8f7ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#67e8f9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dv-jelly" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="dv-vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000208" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="dv-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- water column -->
  <rect width="600" height="400" fill="url(#dv-water)"/>

  <!-- god rays -->
  <g>
    <polygon points="90,0 150,0 250,400 40,400" fill="url(#dv-ray)" opacity="0.5"/>
    <polygon points="260,0 300,0 430,400 300,400" fill="url(#dv-ray)" opacity="0.35"/>
    <polygon points="430,0 470,0 600,320 600,180" fill="url(#dv-ray)" opacity="0.3"/>
  </g>

  <!-- surface shimmer -->
  <path d="M0,10 Q40,4 80,10 T160,10 T240,10 T320,10 T400,10 T480,10 T560,10 T640,10 L640,0 L0,0 Z" fill="#e6fbff" opacity="0.5"/>

  <!-- whale silhouette drifting far below -->
  <g transform="translate(430,285) scale(1.05)" opacity="0.55">
    <path d="M60,0 Q35,-20 -10,-15 Q-45,-10 -60,-2 Q-52,4 -42,7 Q-8,17 30,13 Q50,10 60,0 Z" fill="#041c30"/>
    <path d="M-58,-2 Q-72,-12 -80,-9 Q-73,-2 -80,5 Q-70,6 -58,1 Z" fill="#041c30"/>
    <path d="M10,9 Q-4,22 -20,26 Q-6,14 4,10 Z" fill="#041c30"/>
  </g>

  <!-- jellyfish glow -->
  <g transform="translate(120,250)">
    <path d="M-22,0 A22,20 0 0 1 22,0 Q14,8 8,6 Q0,10 -8,6 Q-14,8 -22,0 Z" fill="url(#dv-jelly)"/>
    <g stroke="#c4a5f9" stroke-opacity="0.45" stroke-width="1.6" fill="none">
      <path d="M-12,4 Q-16,26 -10,44"/>
      <path d="M-4,7 Q-2,30 -6,50"/>
      <path d="M4,7 Q8,28 4,46"/>
      <path d="M12,4 Q18,24 14,40"/>
    </g>
  </g>
  <g transform="translate(70,320) scale(0.55)" opacity="0.7">
    <path d="M-22,0 A22,20 0 0 1 22,0 Q14,8 8,6 Q0,10 -8,6 Q-14,8 -22,0 Z" fill="url(#dv-jelly)"/>
  </g>

  <!-- tiny fish school -->
  <g fill="#8fd8f2" opacity="0.75">
    <path d="M480,120 l14,5 -14,5 4,-5 Z"/>
    <path d="M505,132 l12,4 -12,4 3,-4 Z"/>
    <path d="M470,142 l12,4 -12,4 3,-4 Z"/>
    <path d="M498,155 l10,3 -10,4 3,-4 Z"/>
  </g>

  <!-- headlight beam -->
  <polygon points="356,178 600,120 600,300 350,205" fill="url(#dv-beam)"/>

  <!-- bubbles trailing up -->
  <g stroke="#d9f6ff" stroke-opacity="0.7" fill="#d9f6ff" fill-opacity="0.12">
    <circle cx="212" cy="140" r="5"/>
    <circle cx="228" cy="110" r="3.4"/>
    <circle cx="216" cy="82" r="2.4"/>
    <circle cx="232" cy="58" r="1.8"/>
    <circle cx="304" cy="230" r="3"/>
    <circle cx="296" cy="252" r="2"/>
  </g>

  <!-- the sub -->
  <g transform="translate(290,190) rotate(9)" filter="url(#dv-soft)">
    <!-- propeller -->
    <ellipse cx="-66" cy="0" rx="5" ry="16" fill="#94a3b8" opacity="0.85"/>
    <circle cx="-66" cy="0" r="4" fill="#64748b"/>
    <!-- tail fin -->
    <path d="M-44,-12 Q-64,-30 -70,-8 Q-62,-2 -48,-2 Z" fill="#d97706"/>
    <!-- hull -->
    <path d="M62,0 Q60,-22 26,-27 Q-24,-31 -48,-17 Q-60,0 -48,16 Q-24,29 26,26 Q60,21 62,0 Z" fill="url(#dv-hull)"/>
    <path d="M38,-21 Q-6,-26 -38,-16" stroke="#fffbeb" stroke-opacity="0.65" stroke-width="2.5" fill="none"/>
    <!-- sail -->
    <path d="M-6,-25 Q-4,-42 10,-42 Q20,-42 20,-26 Z" fill="#f59e0b"/>
    <circle cx="10" cy="-34" r="3.2" fill="#7dd3fc"/>
    <!-- porthole -->
    <circle cx="18" cy="-2" r="19" fill="#92400e"/>
    <circle cx="18" cy="-2" r="15" fill="url(#dv-glass)"/>
    <path d="M8,-10 A11,11 0 0 1 16,-14" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5" fill="none"/>
    <!-- rivets -->
    <g fill="#78350f" opacity="0.6">
      <circle cx="-36" cy="10" r="1.6"/><circle cx="-20" cy="12" r="1.6"/><circle cx="-4" cy="13" r="1.6"/><circle cx="40" cy="8" r="1.6"/>
    </g>
    <!-- headlight lens -->
    <circle cx="56" cy="5" r="4.4" fill="#f0fdff"/>
  </g>

  <!-- anglerfish in the dark, lure glowing -->
  <g transform="translate(468,352)">
    <circle cx="26" cy="-18" r="22" fill="url(#dv-lure)"/>
    <circle cx="26" cy="-18" r="2.6" fill="#ffffff"/>
    <path d="M10,-10 Q18,-18 26,-18" stroke="#9fb6bf" stroke-opacity="0.6" stroke-width="1.6" fill="none"/>
    <path d="M22,2 Q14,-14 -6,-12 Q-24,-8 -28,0 Q-24,10 -6,12 Q12,14 22,2 Z" fill="#0a0812"/>
    <path d="M-26,0 L-38,-7 L-38,7 Z" fill="#0a0812"/>
    <path d="M22,2 Q12,5 6,10 Q14,12 20,7 Z" fill="#020204"/>
    <g stroke="#cfe8ee" stroke-opacity="0.8" stroke-width="1">
      <line x1="19" y1="4" x2="18" y2="8"/><line x1="15" y1="6" x2="14" y2="10"/><line x1="11" y1="7" x2="10" y2="11"/>
    </g>
    <circle cx="12" cy="-5" r="2" fill="#bfe9f2" opacity="0.8"/>
  </g>

  <!-- marine snow -->
  <g fill="#e2f0fa">
    <circle cx="60" cy="90" r="1.4" opacity="0.5"/><circle cx="150" cy="180" r="1.2" opacity="0.4"/>
    <circle cx="340" cy="90" r="1.5" opacity="0.5"/><circle cx="390" cy="250" r="1.2" opacity="0.35"/>
    <circle cx="520" cy="210" r="1.4" opacity="0.4"/><circle cx="250" cy="310" r="1.3" opacity="0.35"/>
    <circle cx="180" cy="350" r="1.2" opacity="0.3"/><circle cx="420" cy="60" r="1.2" opacity="0.5"/>
    <circle cx="560" cy="120" r="1.3" opacity="0.45"/><circle cx="90" cy="240" r="1.2" opacity="0.35"/>
  </g>
  <!-- biolume motes near the bottom -->
  <g fill="#67e8f9" filter="url(#dv-soft)">
    <circle cx="140" cy="370" r="1.6" opacity="0.8"/><circle cx="330" cy="356" r="1.4" opacity="0.7"/>
    <circle cx="240" cy="384" r="1.5" opacity="0.75"/><circle cx="560" cy="330" r="1.4" opacity="0.6"/>
  </g>

  <rect width="600" height="400" fill="url(#dv-vignette)"/>
</svg>
