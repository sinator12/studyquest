<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="dd-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a2e"/>
      <stop offset="0.65" stop-color="#160f1d"/>
      <stop offset="1" stop-color="#0b070f"/>
    </linearGradient>
    <linearGradient id="dd-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#231626"/>
      <stop offset="1" stop-color="#0e0812"/>
    </linearGradient>
    <linearGradient id="dd-arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120b18"/>
      <stop offset="1" stop-color="#05030a"/>
    </linearGradient>
    <radialGradient id="dd-torchglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dd-slime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="dd-armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="dd-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="dd-crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="dd-vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="dd-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dungeon wall + floor -->
  <rect width="600" height="400" fill="url(#dd-wall)"/>
  <g stroke="#3b2a4a" stroke-width="1.5" opacity="0.35">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="80" y1="60" x2="80" y2="120"/><line x1="250" y1="60" x2="250" y2="120"/><line x1="430" y1="60" x2="430" y2="120"/>
    <line x1="160" y1="120" x2="160" y2="180"/><line x1="340" y1="120" x2="340" y2="180"/><line x1="520" y1="120" x2="520" y2="180"/>
    <line x1="60" y1="180" x2="60" y2="240"/><line x1="480" y1="180" x2="480" y2="240"/>
  </g>
  <rect y="300" width="600" height="100" fill="url(#dd-floor)"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- deep archway -->
  <path d="M240 300 L240 160 A60 60 0 0 1 360 160 L360 300 Z" fill="#31213f"/>
  <path d="M248 300 L248 164 A52 52 0 0 1 352 164 L352 300 Z" fill="url(#dd-arch)"/>

  <!-- torches -->
  <g>
    <circle cx="60" cy="140" r="90" fill="url(#dd-torchglow)"/>
    <rect x="55" y="150" width="10" height="34" rx="4" fill="#3f2d1d"/>
    <g filter="url(#dd-glow)">
      <path d="M60 112 Q72 132 60 148 Q48 132 60 112" fill="#fb923c"/>
      <path d="M60 122 Q67 134 60 145 Q53 134 60 122" fill="#fde68a"/>
    </g>
  </g>
  <g>
    <circle cx="540" cy="140" r="90" fill="url(#dd-torchglow)"/>
    <rect x="535" y="150" width="10" height="34" rx="4" fill="#3f2d1d"/>
    <g filter="url(#dd-glow)">
      <path d="M540 112 Q552 132 540 148 Q528 132 540 112" fill="#fb923c"/>
      <path d="M540 122 Q547 134 540 145 Q533 134 540 122" fill="#fde68a"/>
    </g>
  </g>

  <!-- embers -->
  <g fill="#fbbf24" opacity="0.7">
    <circle cx="90" cy="100" r="2"/><circle cx="72" cy="70" r="1.5"/><circle cx="515" cy="95" r="2"/>
    <circle cx="556" cy="72" r="1.5"/><circle cx="300" cy="80" r="1.4"/>
  </g>

  <!-- hero knight (left) -->
  <g transform="translate(150,318)">
    <ellipse cx="0" cy="4" rx="44" ry="9" fill="#000000" opacity="0.45"/>
    <!-- cape -->
    <path d="M-6 -104 Q-42 -70 -34 -12 L-16 -22 Q-22 -62 -6 -86 Z" fill="#312e63"/>
    <!-- legs -->
    <rect x="-16" y="-42" width="13" height="34" rx="6" fill="#475569"/>
    <rect x="4" y="-42" width="13" height="34" rx="6" fill="#64748b"/>
    <rect x="-17" y="-14" width="17" height="10" rx="4" fill="#334155"/>
    <rect x="3" y="-14" width="17" height="10" rx="4" fill="#475569"/>
    <!-- torso -->
    <rect x="-21" y="-106" width="42" height="62" rx="13" fill="url(#dd-armor)"/>
    <rect x="-21" y="-54" width="42" height="10" rx="4" fill="#7c5a29"/>
    <rect x="-6" y="-56" width="12" height="13" rx="3" fill="#fbbf24"/>
    <path d="M0 -94 L6 -82 L0 -70 L-6 -82 Z" fill="#fbbf24"/>
    <!-- shield arm -->
    <g transform="translate(-20,-88) rotate(-18)">
      <rect x="-5" y="0" width="11" height="28" rx="5" fill="#475569"/>
      <path d="M-16 20 Q2 15 14 24 Q14 48 -1 58 Q-18 46 -16 20 Z" fill="#334f7e" stroke="#fbbf24" stroke-width="3"/>
    </g>
    <!-- helmet -->
    <g transform="translate(0,-118)">
      <path d="M-16 0 A16 16 0 0 1 16 0 L16 10 Q16 15 9 15 L-9 15 Q-16 15 -16 10 Z" fill="url(#dd-armor)"/>
      <rect x="2" y="-2" width="13" height="6" rx="3" fill="#0b1020"/>
      <rect x="4" y="-1" width="9" height="4" rx="2" fill="#22d3ee"/>
      <path d="M-2 -14 Q-14 -28 -26 -22" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- sword arm raised -->
    <g transform="translate(15,-92) rotate(38)">
      <rect x="-5" y="-2" width="11" height="26" rx="5" fill="#64748b"/>
      <circle cx="1" cy="26" r="7" fill="#94a3b8"/>
      <g transform="translate(1,28) rotate(-115)" filter="url(#dd-glow)">
        <path d="M8 -4 L56 -3 L66 0 L56 3 L8 4 Z" fill="url(#dd-blade)"/>
        <rect x="4" y="-9" width="5" height="18" rx="2" fill="#f59e0b"/>
        <rect x="-8" y="-3" width="13" height="6" rx="3" fill="#7c5a29"/>
        <circle cx="-11" cy="0" r="4" fill="#fbbf24"/>
      </g>
    </g>
  </g>

  <!-- slash spark between them -->
  <g filter="url(#dd-glow)">
    <path d="M305 195 A46 46 0 0 1 352 240" fill="none" stroke="#fde68a" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <circle cx="330" cy="205" r="3" fill="#fef9c3"/>
    <circle cx="352" cy="228" r="2.4" fill="#fde68a"/>
  </g>

  <!-- the Slime King (right) -->
  <g transform="translate(432,320)">
    <ellipse cx="0" cy="4" rx="62" ry="10" fill="#000000" opacity="0.45"/>
    <path d="M-58 2 C-64 -52 -32 -76 0 -74 C32 -76 64 -50 58 2 Q0 12 -58 2 Z" fill="url(#dd-slime)"/>
    <ellipse cx="-16" cy="-52" rx="14" ry="8" fill="#ffffff" opacity="0.35" transform="rotate(-18 -16 -52)"/>
    <!-- eyes + mouth -->
    <circle cx="-16" cy="-38" r="8" fill="#ffffff"/><circle cx="-19" cy="-37" r="4" fill="#0c2e1c"/>
    <circle cx="14" cy="-38" r="8" fill="#ffffff"/><circle cx="11" cy="-37" r="4" fill="#0c2e1c"/>
    <path d="M-8 -22 Q0 -14 8 -22" fill="none" stroke="#0c2e1c" stroke-width="3.4" stroke-linecap="round"/>
    <!-- crown -->
    <g transform="translate(-2,-76)">
      <path d="M-24 0 L-24 -15 L-12 -5 L0 -21 L12 -5 L24 -15 L24 0 Z" fill="url(#dd-crown)"/>
      <circle cx="0" cy="-5" r="3" fill="#ef4444"/>
    </g>
    <!-- hp diamonds -->
    <g transform="translate(0,-102)">
      <rect x="-30" y="-6" width="12" height="12" rx="2" transform="rotate(45 -24 0)" fill="#4ade80" stroke="#bbf7d0" stroke-width="1.6"/>
      <rect x="-6" y="-6" width="12" height="12" rx="2" transform="rotate(45 0 0)" fill="#4ade80" stroke="#bbf7d0" stroke-width="1.6"/>
      <rect x="18" y="-6" width="12" height="12" rx="2" transform="rotate(45 24 0)" fill="#111827" stroke="#4b5563" stroke-width="1.6"/>
    </g>
  </g>

  <!-- bat friend -->
  <g transform="translate(510,205)" opacity="0.92">
    <path d="M-8 0 Q-26 -16 -40 -8 Q-30 2 -22 4 Q-14 2 -8 6 Z" fill="#4c3168"/>
    <path d="M8 0 Q26 -16 40 -8 Q30 2 22 4 Q14 2 8 6 Z" fill="#4c3168"/>
    <ellipse cx="0" cy="2" rx="11" ry="13" fill="#5b3a80"/>
    <path d="M-8 -9 L-5 -18 L-1 -10 Z" fill="#5b3a80"/><path d="M8 -9 L5 -18 L1 -10 Z" fill="#5b3a80"/>
    <circle cx="-4" cy="0" r="3" fill="#ffd9a8"/><circle cx="4" cy="0" r="3" fill="#ffd9a8"/>
  </g>

  <!-- coins on the floor -->
  <g filter="url(#dd-glow)">
    <ellipse cx="292" cy="352" rx="9" ry="7" fill="#fbbf24"/>
    <ellipse cx="312" cy="360" rx="7" ry="5.5" fill="#f59e0b"/>
    <ellipse cx="274" cy="364" rx="6" ry="5" fill="#fde68a"/>
  </g>

  <!-- hearts -->
  <g transform="translate(30,28)" filter="url(#dd-glow)">
    <path d="M10 6 A6 6 0 0 1 22 6 A6 6 0 0 1 34 6 Q34 16 22 25 Q10 16 10 6 Z" fill="#f43f5e"/>
    <path d="M42 6 A6 6 0 0 1 54 6 A6 6 0 0 1 66 6 Q66 16 54 25 Q42 16 42 6 Z" fill="#f43f5e"/>
    <path d="M74 6 A6 6 0 0 1 86 6 A6 6 0 0 1 98 6 Q98 16 86 25 Q74 16 74 6 Z" fill="#3f3f46"/>
  </g>

  <rect width="600" height="400" fill="url(#dd-vignette)"/>
</svg>
