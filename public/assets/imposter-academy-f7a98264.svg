<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="ia-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101C36"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <radialGradient id="ia-lamp" cx="0.32" cy="0.3" r="0.65">
      <stop offset="0" stop-color="#F3C069" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#F3C069" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F3C069" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ia-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#0A1120" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#0A1120" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A1120" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="ia-manila" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E4BD"/>
      <stop offset="0.6" stop-color="#EAD8A9"/>
      <stop offset="1" stop-color="#D6C08B"/>
    </linearGradient>
    <linearGradient id="ia-manilaBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6C08B"/>
      <stop offset="1" stop-color="#A98F58"/>
    </linearGradient>
    <radialGradient id="ia-wax" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#B23A3A"/>
      <stop offset="0.55" stop-color="#8E1F24"/>
      <stop offset="1" stop-color="#6E1418"/>
    </radialGradient>
    <radialGradient id="ia-cam" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#7CCB92"/>
      <stop offset="0.6" stop-color="#4FAE6E"/>
      <stop offset="1" stop-color="#2E7C4F"/>
    </radialGradient>
  </defs>

  <!-- night felt desk -->
  <rect width="600" height="400" fill="url(#ia-night)"/>
  <ellipse cx="190" cy="120" rx="280" ry="210" fill="url(#ia-lamp)"/>

  <!-- faint scattered case files in the back -->
  <g opacity="0.5">
    <rect x="-30" y="300" width="150" height="105" rx="8" transform="rotate(-10 45 352)" fill="url(#ia-manilaBack)"/>
    <rect x="470" y="20" width="140" height="100" rx="8" transform="rotate(9 540 70)" fill="url(#ia-manilaBack)"/>
  </g>

  <!-- desk edge -->
  <rect y="366" width="600" height="34" fill="#080D1A" opacity="0.55"/>
  <rect y="366" width="600" height="3" fill="#1B2C52" opacity="0.5"/>

  <!-- loose case-note scraps + paperclip -->
  <g opacity="0.85">
    <rect x="34" y="176" width="30" height="20" rx="3" fill="#EAD8A9" transform="rotate(-14 49 186)"/>
    <line x1="39" y1="182" x2="58" y2="179" stroke="#27406E" stroke-width="1.6" opacity="0.4" transform="rotate(-14 49 186)"/>
    <line x1="39" y1="188" x2="52" y2="186" stroke="#27406E" stroke-width="1.6" opacity="0.4" transform="rotate(-14 49 186)"/>
    <circle cx="520" cy="300" r="5" fill="#F6C445"/>
    <circle cx="500" cy="330" r="3.5" fill="#F6C445" opacity="0.7"/>
  </g>
  <g transform="translate(140,70) rotate(-18)" opacity="0.8">
    <path d="M0,0 Q-14,-4 -14,12 L-14,34 Q-14,46 -2,46 Q10,46 10,34 L10,6" fill="none" stroke="#8A6D3B" stroke-width="4" stroke-linecap="round"/>
    <path d="M0,0 Q-8,-2 -8,8 L-8,32" fill="none" stroke="#8A6D3B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- secondary folder, tucked slightly behind primary -->
  <g transform="rotate(6 300 220)">
    <rect x="230" y="120" width="260" height="200" rx="14" fill="url(#ia-manilaBack)"/>
  </g>

  <!-- primary dossier folder -->
  <g transform="rotate(-4 300 210)">
    <!-- paper insert peeking above the flap -->
    <rect x="256" y="66" width="216" height="150" rx="6" fill="#F8F1DC"/>
    <line x1="272" y1="86" x2="420" y2="86" stroke="#27406E" stroke-width="3" opacity="0.3"/>
    <line x1="272" y1="100" x2="400" y2="100" stroke="#27406E" stroke-width="3" opacity="0.3"/>

    <!-- folder body -->
    <rect x="244" y="96" width="240" height="200" rx="14" fill="url(#ia-manila)" stroke="#A98F58" stroke-width="3"/>
    <!-- folder tab -->
    <rect x="264" y="82" width="86" height="26" rx="7" fill="#EAD8A9" stroke="#A98F58" stroke-width="3"/>

    <!-- TOP SECRET stamp (jagged rubber-stamp badge, no literal glyphs per house svg convention) -->
    <g transform="translate(392,150) rotate(-14)">
      <path d="M0,-46 L8,-42 L16,-45 L21,-37 L30,-36 L31,-27 L39,-22 L36,-14 L41,-6 L34,0 L37,9 L28,11 L25,20 L16,17 L9,24 L2,17 L-7,20 L-10,11 L-19,9 L-16,0 L-23,-6 L-18,-14 L-21,-22 L-13,-27 L-12,-36 L-3,-37 Z"
        fill="none" stroke="#C22D2D" stroke-width="4.5"/>
      <circle cx="0" cy="-8" r="24" fill="none" stroke="#C22D2D" stroke-width="3"/>
      <path d="M-11,-8 L-4,-1 L12,-16" fill="none" stroke="#C22D2D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-15" y1="14" x2="15" y2="14" stroke="#C22D2D" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-11" y1="21" x2="11" y2="21" stroke="#C22D2D" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- ink lines suggesting redacted dossier text -->
    <line x1="264" y1="230" x2="392" y2="230" stroke="#27406E" stroke-width="4" opacity="0.28"/>
    <line x1="264" y1="246" x2="452" y2="246" stroke="#27406E" stroke-width="4" opacity="0.28"/>
    <rect x="264" y="260" width="70" height="10" rx="2" fill="#1B2C52" opacity="0.55"/>
    <line x1="344" y1="265" x2="420" y2="265" stroke="#27406E" stroke-width="4" opacity="0.28"/>

    <!-- wax seal on the lower corner of the folder -->
    <g transform="translate(276,278)">
      <path d="M0,30 Q-18,12 -11,-6 Q-5,4 0,-3 Q5,4 11,-6 Q18,12 0,30 Z" fill="#6E1418" opacity="0.9"/>
      <circle cx="0" cy="-3" r="23" fill="url(#ia-wax)" stroke="#6E1418" stroke-width="2"/>
      <path d="M0,-15 L4.5,-4.5 L15,-3 L6.5,4.5 L9.5,15 L0,9 L-9.5,15 L-6.5,4.5 L-15,-3 L-4.5,-4.5 Z" fill="#B23A3A" opacity="0.8"/>
    </g>
  </g>

  <!-- Agent Cam: cute chameleon peeking over the desk edge, mole-mash "popping out" convention -->
  <g transform="translate(96,352)">
    <!-- curled tail, drawn first so it sits behind the body -->
    <path d="M-46,4 Q-70,-2 -66,-22 Q-63,-36 -48,-32" fill="none" stroke="#2E7C4F" stroke-width="9" stroke-linecap="round"/>
    <!-- back casque ridge -->
    <path d="M-8,-70 L2,-84 L10,-68 Z" fill="#2E7C4F"/>
    <!-- body/head -->
    <ellipse cx="0" cy="-38" rx="52" ry="56" fill="url(#ia-cam)" stroke="#2E7C4F" stroke-width="3"/>
    <!-- trench-coat collar -->
    <path d="M-40,4 Q0,26 40,4 L46,26 Q0,50 -46,26 Z" fill="#C9A86A" stroke="#A5854C" stroke-width="2.5"/>
    <!-- little gripping hand on the folder edge -->
    <g transform="translate(44,-4)">
      <ellipse cx="0" cy="0" rx="13" ry="10" fill="url(#ia-cam)" stroke="#2E7C4F" stroke-width="2.5"/>
      <line x1="-6" y1="-6" x2="-9" y2="-12" stroke="#2E7C4F" stroke-width="3" stroke-linecap="round"/>
      <line x1="2" y1="-8" x2="2" y2="-15" stroke="#2E7C4F" stroke-width="3" stroke-linecap="round"/>
      <line x1="9" y1="-5" x2="14" y2="-10" stroke="#2E7C4F" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- big cartoon eyes -->
    <circle cx="-20" cy="-58" r="17" fill="#0F172A"/>
    <circle cx="-22" cy="-61" r="13" fill="#F2E4BD"/>
    <circle cx="-21" cy="-60" r="6" fill="#0F172A"/>
    <circle cx="-24" cy="-63" r="2.5" fill="#F8F1DC"/>
    <circle cx="24" cy="-56" r="15" fill="#0F172A"/>
    <circle cx="22" cy="-59" r="11" fill="#F2E4BD"/>
    <circle cx="23" cy="-58" r="5" fill="#0F172A"/>
    <circle cx="20" cy="-61" r="2.2" fill="#F8F1DC"/>
    <!-- smile -->
    <path d="M-12,-16 Q0,-8 12,-16" fill="none" stroke="#2E7C4F" stroke-width="3.5" stroke-linecap="round"/>
    <!-- belly patch -->
    <ellipse cx="0" cy="-14" rx="24" ry="18" fill="#B9E3BC" opacity="0.55"/>
  </g>

  <!-- subtle vignette on top -->
  <rect width="600" height="400" fill="url(#ia-vig)"/>
</svg>
